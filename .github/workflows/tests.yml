name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (stdlib only, no dependencies)
        run: python -m unittest discover -s tests -t tests -v
      - name: Smoke test the launcher
        run: |
          ./bin/nbdiff --version
          ./bin/nbdiff --stat -A examples/before.ipynb examples/after.ipynb || test $? -eq 1
      - name: Generated diff notebook is schema-valid
        run: |
          python -m pip install --quiet nbformat
          ./bin/nbdiff --visualize /tmp/diff.ipynb examples/before.ipynb examples/after.ipynb || test $? -eq 1
          python -c "import nbformat; nbformat.validate(nbformat.read('/tmp/diff.ipynb', as_version=4)); print('valid')"
