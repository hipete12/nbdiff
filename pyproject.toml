[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nbdiff-cli"
dynamic = ["version"]
description = "diff(1) for Jupyter notebooks: cell-aware source, output and metadata diffs, with an optional rendered diff notebook"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["jupyter", "notebook", "ipynb", "diff", "cli"]
classifiers = [
    "Environment :: Console",
    "Framework :: Jupyter",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control",
]
dependencies = []

[project.scripts]
nbdiff = "nbdiff.cli:main"

[tool.setuptools]
packages = ["nbdiff"]

[tool.setuptools.dynamic]
version = { attr = "nbdiff.__version__" }
